name: Gold Session Lab safety checks
on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OANDA_API_TOKEN: ''
      OANDA_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt httpx
      - name: Python compilation
        run: python -m compileall -q app.py goldlab tests
      - name: JavaScript syntax validation
        run: node --check static/js/dashboard.js
      - name: Git hook shell syntax validation
        run: bash -n scripts/install-antigravity-hooks.sh scripts/antigravity-after-pull.sh scripts/antigravity-headless-review.sh
      - name: Unit and API regression suite
        run: python -m pytest -q
